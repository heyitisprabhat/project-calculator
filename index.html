<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Fonts -->

    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="calc-body">
        <div class="calc-display"></div>
        <div class="calc-buttons">
          <div class="row">
            <button class="btn clear-btn">C</button>
            <button class="btn symbol-btn">%</button>
            <button class="btn backspace-btn"><img src="backspace.svg" alt="image of kack arrow" width="30" height="30"></button>
            <button class="btn symbol-btn">÷</button>
          </div>
          <div class="row">
            <button class="btn number-btn">7</button>
            <button class="btn number-btn">8</button>
            <button class="btn number-btn">9</button>
            <button class="btn symbol-btn">×</button>
          </div>
          <div class="row">
            <button class="btn number-btn">4</button>
            <button class="btn number-btn">5</button>
            <button class="btn number-btn">6</button>
            <button class="btn symbol-btn">-</button>
          </div>
          <div class="row">
            <button class="btn number-btn">1</button>
            <button class="btn number-btn">2</button>
            <button class="btn number-btn">3</button>
            <button class="btn symbol-btn">+</button>
          </div>
          <div class="row">
            <button class="btn number-btn">00</button>
            <button class="btn number-btn">0</button>
            <button class="btn number-btn">.</button>
            <button class="btn evaluate-btn">=</button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
